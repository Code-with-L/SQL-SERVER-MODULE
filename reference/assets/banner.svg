<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360" role="img" aria-label="Microsoft SQL Server: black obsidian abstract banner">
  <defs>
    <radialGradient id="void" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0%" stop-color="#1b1e24"/>
      <stop offset="55%" stop-color="#0a0b0e"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- silver edge-light, now drawn as a soft vertical gradient band: no blur filter -->
    <linearGradient id="foldSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#c6cdd8" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#e9edf3" stop-opacity="0.85"/>
      <stop offset="65%"  stop-color="#aeb6c3" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- faint vignette, also pure gradient -->
    <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.72">
      <stop offset="0%"  stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>

    <clipPath id="frame"><rect x="0" y="0" width="900" height="360" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="360" fill="url(#void)"/>

    <!-- deep darkness pooling in the corners -->
    <ellipse cx="700" cy="330" rx="380" ry="200" fill="#000" opacity=".55"/>
    <ellipse cx="80" cy="20" rx="330" ry="180" fill="#000" opacity=".5"/>

    <!-- THE obsidian fold: one continuous curved surface -->
    <path d="M -40 320
             C 180 320, 320 210, 470 190
             C 600 172, 700 250, 940 250
             L 940 360 L -40 360 Z"
          fill="#0b0c0f"/>

    <!-- silver edge-light along the fold -->
    <path d="M -40 320
             C 180 320, 320 210, 470 190
             C 600 172, 700 250, 940 250
             L 940 258
             C 700 258, 600 180, 470 198
             C 320 218, 180 328, -40 328 Z"
          fill="url(#foldSheen)" opacity=".9"/>

    <!-- faint cool shadow under the fold lip -->
    <path d="M -40 328
             C 180 328, 320 218, 470 198
             C 600 180, 700 258, 940 258
             L 940 300
             C 700 300, 600 220, 470 236
             C 320 256, 180 340, -40 340 Z"
          fill="#000" opacity=".45"/>

    <!-- second, quieter high tone lower-left -->
    <path d="M -40 356
             C 240 356, 430 312, 620 302
             C 760 295, 860 316, 940 318
             L 940 360 L -40 360 Z"
          fill="#12141a" opacity=".6"/>

    <!-- cooler bright rim along the secondary edge -->
    <path d="M -40 356
             C 240 356, 430 312, 620 302
             C 760 295, 860 316, 940 318" fill="none" stroke="#9aa3b2" stroke-width="1.4" opacity=".35"/>

    <!-- soft vignette, no turbulence needed -->
    <rect width="900" height="360" fill="url(#vignette)"/>

    <!-- ================= ONLY the wordmark ================= -->

    <text x="70" y="158" font-family="'Segoe UI',Arial,Helvetica,sans-serif"
          font-size="44" font-weight="200" letter-spacing="6" fill="#e8ebf0">MICROSOFT</text>

    <text x="70" y="216" font-family="'Segoe UI',Arial,Helvetica,sans-serif"
          font-size="58" font-weight="600" letter-spacing="2.5" fill="#ffffff">SQL SERVER</text>

    <rect x="72" y="236" width="120" height="1.4" fill="#5c6678"/>

    <text x="72" y="266" font-family="'Segoe UI',Arial,Helvetica,sans-serif"
          font-size="11.5" letter-spacing="5.5" fill="#8b93a3">MODULE</text>
  </g>

  <rect x=".7" y=".7" width="898.6" height="358.6" rx="13.3" fill="none" stroke="#1d212b" stroke-width="1.4"/>
</svg>
