<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%"
     height="480" role="img"
     aria-label="Animated copy-on-write: a database snapshot creates instantly and grows only when pages change">

  <defs>
    <linearGradient id="cwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#071018"/>
      <stop offset="100%" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="srcG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="snapG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <marker id="cwArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <style>
    .mono { font-family:'Cascadia Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; }
    .head { fill:#e2e8f0; font-size:16px; font-weight:700; }
    .sub  { fill:#7c8595; font-size:11.5px; }
    .lbl  { fill:#cbd5e1; font-size:12.5px; font-weight:600; }
    .txt  { fill:#94a3b8; font-size:11px; }
    .big  { fill:#a78bfa; font-size:15px; font-weight:700; }
    .tick { fill:#64748b; font-size:11px; }

    /* page states */
    .shared   { fill:#1e3a5f; stroke:#3b82f6; }
    .dirty    { fill:#4c1d95; stroke:#a78bfa; }
    .copied   { fill:#3b0764; stroke:#c084fc; }
    .newpage  { animation: appear 14s ease-out infinite; }
    @keyframes appear { 0%,3% { opacity:0 } 5%,100% { opacity:1 } }

    .copyAnim { animation: copyFx 14s ease-in-out infinite; }
    @keyframes copyFx {
      0%,3%   { opacity:0; transform:translateY(-14px) scale(.8); }
      5%      { opacity:1; transform:none; }
      92%     { opacity:1; }
      96%,100%{ opacity:0; }
    }

    /* the "no copy happened" strike-through over unchanged pages */
    .nostrk { animation: stk 14s linear infinite; }
    @keyframes stk {
      0%,4%   { opacity:0; }
      6%,92%  { opacity:.85; }
      96%,100%{ opacity:0; }
    }

    .flash { animation: flash 14s ease-in-out infinite; }
    @keyframes flash {
      0%,3%   { fill:#1e293b; }
      4.5%    { fill:#b91c1c; }
      7%      { fill:#1e293b; }
      100%    { fill:#1e293b; }
    }

    /* size readouts */
    .sz1 { animation: sz1 14s ease-in-out infinite; }
    .sz2 { animation: sz2 14s ease-in-out infinite; }
    @keyframes sz1 { 0%,6%{opacity:.35} 20%,90%{opacity:1} 96%,100%{opacity:.35} }
    @keyframes sz2 { 0%,6%{opacity:.35} 14%{opacity:.35} 30%,90%{opacity:1} 96%,100%{opacity:.35} }

    /* headline stat */
    .stat { animation: statPop 14s ease-in-out infinite; }
    @keyframes statPop {
      0%,5%   { opacity:.4; transform:scale(.96); }
      8%      { opacity:1; transform:scale(1); }
      90%     { opacity:1; transform:scale(1); }
      96%,100%{ opacity:.4; transform:scale(.96); }
    }

    .sweep { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0%,100%{opacity:.05} 50%{opacity:.22} }

    .spin { animation: spin 3.4s linear infinite; transform-origin:840px 70px; }
    @keyframes spin { to { transform:rotate(360deg) } }

    @media (prefers-reduced-motion: reduce) {
      .newpage,.copyAnim,.nostrk,.flash,.sz1,.sz2,.stat,.sweep,.spin { animation:none; opacity:1 }
    }
  </style>

  <rect width="960" height="480" fill="url(#cwBg)"/>

  <text x="26" y="34" class="mono head">COPY-ON-WRITE — why a 400 GB snapshot takes one second</text>
  <text x="26" y="54" class="mono sub">Nothing is copied at creation. Pages are duplicated only when the source changes them.</text>

  <!-- ================= SOURCE DATABASE ================= -->
  <g>
    <rect x="40" y="86" width="380" height="230" rx="11" fill="#0d1b26" stroke="#0e7490"/>
    <rect x="40" y="86" width="380" height="30" rx="11" fill="url(#srcG)"/>
    <rect x="40" y="106" width="380" height="10" fill="url(#srcG)"/>
    <text x="58" y="107" class="mono" font-size="12.5" font-weight="700" fill="#042f3a">
      StudentRecordsDB  ·  live, writable
    </text>
    <text x="404" y="107" class="mono" font-size="10.5" fill="#a5f3fc" text-anchor="end">400 GB</text>

    <!-- page grid: 6 cols x 4 rows -->
    <g transform="translate(58,132)">
      <g class="flash"><rect x="0"   y="0"  width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="58"  y="0"  width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="116" y="0"  width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="174" y="0"  width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="232" y="0"  width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="290" y="0"  width="52" height="34" rx="4" class="shared"/></g>

      <g class="flash"><rect x="0"   y="40" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="58"  y="40" width="52" height="34" rx="4" class="newpage"/></g>
      <g class="flash"><rect x="116" y="40" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="174" y="40" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="232" y="40" width="52" height="34" rx="4" class="newpage"/></g>
      <g class="flash"><rect x="290" y="40" width="52" height="34" rx="4" class="shared"/></g>

      <g class="flash"><rect x="0"   y="80" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="58"  y="80" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="116" y="80" width="52" height="34" rx="4" class="newpage"/></g>
      <g class="flash"><rect x="174" y="80" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="232" y="80" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="290" y="80" width="52" height="34" rx="4" class="shared"/></g>

      <g class="flash"><rect x="0"   y="120" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="58"  y="120" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="116" y="120" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="174" y="120" width="52" height="34" rx="4" class="newpage"/></g>
      <g class="flash"><rect x="232" y="120" width="52" height="34" rx="4" class="shared"/></g>
      <g class="flash"><rect x="290" y="120" width="52" height="34" rx="4" class="shared"/></g>
    </g>

    <text x="58" y="300" class="mono txt">
      <tspan fill="#f87171">●</tspan> a page changes  →  the ORIGINAL is copied out
    </text>
  </g>

  <!-- ================= COPY ARROWS ================= -->
  <g class="copyAnim">
    <path d="M428 150 C 470 150, 480 168, 520 168"
          fill="none" stroke="#a78bfa" stroke-width="2.5"
          stroke-dasharray="6 5" marker-end="url(#cwArrow)"/>
    <path d="M428 192 C 470 192, 480 200, 520 200"
          fill="none" stroke="#a78bfa" stroke-width="2.5"
          stroke-dasharray="6 5" marker-end="url(#cwArrow)"/>
    <path d="M428 252 C 470 252, 480 236, 520 236"
          fill="none" stroke="#a78bfa" stroke-width="2.5"
          stroke-dasharray="6 5" marker-end="url(#cwArrow)"/>
    <text x="474" y="140" class="mono" font-size="10.5" fill="#c084fc" text-anchor="middle">
      original page
    </text>
  </g>

  <!-- ================= SNAPSHOT ================= -->
  <g>
    <rect x="528" y="86" width="392" height="230" rx="11" fill="#150c26" stroke="#6d28d9"/>
    <rect x="528" y="86" width="392" height="30" rx="11" fill="url(#snapG)"/>
    <rect x="528" y="106" width="392" height="10" fill="url(#snapG)"/>
    <text x="546" y="107" class="mono" font-size="12.5" font-weight="700" fill="#1e0b3f">
      StudentRecordsDB_snap1  ·  READ-ONLY
    </text>
    <text x="546" y="140" class="mono big sz1">8 MB</text>
    <text x="546" y="157" class="mono txt sz1">size at creation</text>
    <text x="546" y="190" class="mono big sz2">1.4 GB</text>
    <text x="546" y="207" class="mono txt sz2">after the source changed</text>

    <!-- snapshot page grid, filling in over time -->
    <g transform="translate(546,222)">
      <g class="copyAnim" style="animation-delay:0s">
        <rect x="0"   y="0" width="46" height="28" rx="4" class="copied"/>
        <rect x="52"  y="0" width="46" height="28" rx="4" class="copied"/>
      </g>
      <g class="copyAnim" style="animation-delay:.25s">
        <rect x="104" y="0" width="46" height="28" rx="4" class="copied"/>
      </g>
      <g class="copyAnim" style="animation-delay:.45s">
        <rect x="156" y="0" width="46" height="28" rx="4" class="copied"/>
      </g>
      <g class="copyAnim" style="animation-delay:.7s">
        <rect x="208" y="0" width="46" height="28" rx="4" class="copied"/>
        <rect x="260" y="0" width="46" height="28" rx="4" class="copied"/>
      </g>
      <g class="copyAnim" style="animation-delay:1.1s">
        <rect x="0"   y="34" width="46" height="28" rx="4" class="copied"/>
        <rect x="52"  y="34" width="46" height="28" rx="4" class="copied"/>
      </g>
      <g class="copyAnim" style="animation-delay:1.35s">
        <rect x="104" y="34" width="46" height="28" rx="4" class="copied"/>
      </g>
      <!-- unchanged pages: still shared, shown faint -->
      <g opacity=".28">
        <rect x="156" y="34" width="46" height="28" rx="4" class="shared"/>
        <rect x="208" y="34" width="46" height="28" rx="4" class="shared"/>
        <rect x="260" y="34" width="46" height="28" rx="4" class="shared"/>
        <rect x="0"   y="68" width="46" height="28" rx="4" class="shared"/>
        <rect x="52"  y="68" width="46" height="28" rx="4" class="shared"/>
        <rect x="104" y="68" width="46" height="28" rx="4" class="shared"/>
        <rect x="156" y="68" width="46" height="28" rx="4" class="shared"/>
        <rect x="208" y="68" width="46" height="28" rx="4" class="shared"/>
        <rect x="260" y="68" width="46" height="28" rx="4" class="shared"/>
      </g>
    </g>
  </g>

  <!-- ================= strike-through on shared pages ================= -->
  <g class="nostrk" stroke="#f87171" stroke-width="2" stroke-linecap="round">
    <line x1="58"  y1="132" x2="404" y2="272"/>
  </g>
  <text x="470" y="300" class="mono nostrk" font-size="10.5" fill="#f87171" text-anchor="middle">
    unchanged pages are SHARED
  </text>

  <!-- ================= headline ================= -->
  <g class="stat" transform="translate(40,346)">
    <rect x="0" y="0" width="440" height="96" rx="10" fill="#0d1420" stroke="#1e3a5f"/>
    <text x="20" y="28" class="mono" font-size="12" font-weight="700" fill="#7dd3fc">
      WHY IT IS INSTANT
    </text>
    <text x="20" y="50" class="mono" font-size="11.5" fill="#94a3b8">
      The snapshot records WHICH pages exist.
    </text>
    <text x="20" y="68" class="mono" font-size="11.5" fill="#94a3b8">
      It copies nothing until the source writes.
    </text>
    <text x="20" y="86" class="mono" font-size="11.5" fill="#c084fc">
      Cost tracks CHANGE, not size.
    </text>
  </g>

  <!-- spinning clock: the 1-second claim -->
  <g transform="translate(760,360)">
    <circle cx="80" cy="40" r="30" fill="#0d1420" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="80" cy="40" r="30" fill="none" stroke="#a78bfa" stroke-width="1"
            stroke-dasharray="4 7" class="spin"/>
    <path d="M80 40 L80 22" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 80 40" to="360 80 40" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M80 40 L93 47" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate"
                        from="0 80 40" to="360 80 40" dur="7.5s" repeatCount="indefinite"/>
    </path>
    <circle cx="80" cy="40" r="3" fill="#e2e8f0"/>
    <text x="80" y="90" class="mono" font-size="10.5" fill="#7c8595" text-anchor="middle">
      CREATE DATABASE … AS SNAPSHOT OF …
    </text>
  </g>

  <!-- footer -->
  <text x="40" y="466" class="mono tick">
    a snapshot is NOT a backup — you cannot RESTORE from it · it has no transaction log · it is read-only
  </text>
</svg>
