<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%"
     height="200" role="img"
     aria-label="SQL Server Module animated logo: a database cylinder inside a terminal prompt">

  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#060a14"/>
    </linearGradient>

    <linearGradient id="lgRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="35%"  stop-color="#818cf8"/>
      <stop offset="65%"  stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
                        from="0 0.5 0.5" to="360 0.5 0.5"
                        dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lgCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#34d399"/>
      <stop offset="50%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.2 0; 0.2 0; -0.2 0"
                        dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="lgGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family:'Cascadia Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; }

    .ring     { animation: spin 14s linear infinite; transform-origin:52px 88px; }
    .ring2    { animation: spin 9s linear infinite reverse; transform-origin:52px 88px; }
    .ring3    { animation: spin 19s linear infinite; transform-origin:52px 88px; }

    @keyframes spin { to { transform:rotate(360deg) } }

    .cyl      { animation: bob 4s ease-in-out infinite; }
    @keyframes bob {
      0%,100% { transform:translateY(0) }
      50%     { transform:translateY(-6px) }
    }

    .band     { animation: bandPulse 3s ease-in-out infinite; }
    @keyframes bandPulse { 0%,100%{opacity:.35} 50%{opacity:.9} }

    /* orbiting query packets */
    .orb1 { animation: orb 3.6s linear infinite; transform-origin:52px 88px; }
    .orb2 { animation: orb 3.6s linear infinite; transform-origin:52px 88px; animation-delay:.9s; }
    .orb3 { animation: orb 3.6s linear infinite; transform-origin:52px 88px; animation-delay:1.8s; }
    .orb4 { animation: orb 3.6s linear infinite; transform-origin:52px 88px; animation-delay:2.7s; }
    @keyframes orb {
      0%   { transform:rotate(0deg) translateX(0px);   opacity:0 }
      8%   { opacity:1 }
      92%  { opacity:1 }
      100% { transform:rotate(360deg) translateX(0px); opacity:0 }
    }

    .title    { fill:#e8edf7; font-size:27px; font-weight:800; letter-spacing:4px; }
    .sub      { fill:#6b7688; font-size:12px; letter-spacing:6.5px; }

    .kw       { fill:#ff7b72; animation: kw 8s steps(1,end) infinite; }
    .kw2      { fill:#79c0ff; animation: kw 8s steps(1,end) infinite; animation-delay:1s; }
    .kw3      { fill:#d2a8ff; animation: kw 8s steps(1,end) infinite; animation-delay:2s; }
    .kw4      { fill:#ffa657; animation: kw 8s steps(1,end) infinite; animation-delay:3s; }
    @keyframes kw { 0%,8%{opacity:.22} 14%,34%{opacity:1} 40%,100%{opacity:.22} }

    .caret    { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .scan     { animation: scanX 5s ease-in-out infinite; }
    @keyframes scanX { 0%,100%{opacity:.06} 50%{opacity:.3} }

    .pulseDot { animation: pulseDot 2s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100%{opacity:.35; r:3 } 50%{opacity:1; r:4.5} }

    @media (prefers-reduced-motion: reduce) {
      .ring,.ring2,.ring3,.cyl,.band,.orb1,.orb2,.orb3,.orb4,
      .kw,.kw2,.kw3,.kw4,.caret,.scan,.pulseDot { animation:none; opacity:1 }
    }
  </style>

  <rect width="900" height="200" rx="14" fill="url(#lgBg)"/>

  <!-- faint grid, gives it depth -->
  <g opacity=".22" stroke="#1e293b" stroke-width=".5">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>
  <rect class="scan" width="900" height="200" fill="#22d3ee" opacity=".05"/>

  <!-- ================= ORBITS ================= -->
  <g>
    <circle class="ring"  cx="52" cy="88" r="58" fill="none"
            stroke="url(#lgRing)" stroke-width="1.6"
            stroke-dasharray="30 200" stroke-linecap="round"/>
    <circle class="ring2" cx="52" cy="88" r="66" fill="none"
            stroke="#f472b6" stroke-width="1.1"
            stroke-dasharray="8 16" opacity=".55"/>
    <circle class="ring3" cx="52" cy="88" r="44" fill="none"
            stroke="#34d399" stroke-width="1"
            stroke-dasharray="4 12" opacity=".45"/>

    <circle class="orb1" cx="52" cy="88" r="58" fill="none"/>
    <circle class="orb2" cx="52" cy="88" r="58" fill="none"/>
    <circle class="orb3" cx="52" cy="88" r="66" fill="none"/>
    <circle class="orb4" cx="52" cy="88" r="66" fill="none"/>

    <g filter="url(#lgGlow)">
      <circle class="orb1" cx="52" cy="88" r="58" fill="none"/>
      <circle class="orb2" cx="52" cy="88" r="58" fill="none"/>
    </g>
  </g>

  <!-- ================= CYLINDER ================= -->
  <g class="cyl">
    <ellipse cx="52" cy="72" rx="30" ry="10" fill="url(#lgCyl)"/>
    <path d="M22 72 v34 a30 10 0 0 0 60 0 v-34 z" fill="#0e2a3a"/>
    <path d="M22 72 v34 a30 10 0 0 0 60 0 v-34" fill="none"
          stroke="#22d3ee" stroke-width="1.8"/>
    <ellipse cx="52" cy="72" rx="30" ry="10" fill="none"
             stroke="#67e8f9" stroke-width="1.8"/>
    <path d="M22 85 a30 10 0 0 0 60 0" fill="none"
          stroke="#22d3ee" stroke-width="1.2" opacity=".6"/>
    <path d="M22 98 a30 10 0 0 0 60 0" fill="none"
          stroke="#22d3ee" stroke-width="1.2" opacity=".35"/>

    <!-- data bands pulsing inside -->
    <g class="band">
      <rect x="34" y="79" width="36" height="2.5" rx="1.2" fill="#67e8f9" opacity=".7"/>
      <rect x="38" y="86" width="28" height="2.5" rx="1.2" fill="#a78bfa" opacity=".7"/>
      <rect x="42" y="93" width="20" height="2.5" rx="1.2" fill="#f472b6" opacity=".7"/>
    </g>
  </g>

  <circle class="pulseDot" cx="52" cy="66" r="3.5" fill="#34d399"/>

  <!-- ================= WORDMARK ================= -->
  <text x="140" y="82" class="mono title">SQL SERVER</text>
  <text x="142" y="106" class="mono sub">M O D U L E</text>

  <!-- rotating keyword strip -->
  <g transform="translate(140,130)">
    <text x="0" y="0" class="mono" font-size="13">
      <tspan class="kw"  font-weight="700">SELECT</tspan>
      <tspan dx="12" class="kw2" font-weight="700">CREATE</tspan>
      <tspan dx="12" class="kw3" font-weight="700">JOIN</tspan>
      <tspan dx="12" class="kw4" font-weight="700">GRANT</tspan>
      <tspan dx="12" fill="#64748b">|</tspan>
      <tspan dx="12" fill="#34d399">BEGIN TRAN</tspan>
      <tspan dx="12" fill="#f472b6">IDENTITY</tspan>
      <tspan dx="12" fill="#64748b">|</tspan>
      <tspan dx="12" fill="#7dd3fc">IsolationLevel</tspan>
      <tspan dx="12" fill="#c084fc">Snapshot</tspan>
    </text>
  </g>

  <!-- prompt line -->
  <g transform="translate(140,166)">
    <text x="0" y="0" class="mono" font-size="13">
      <tspan fill="#34d399">➜</tspan>
      <tspan fill="#7dd3fc" dx="6">git log --oneline</tspan>
      <tspan dx="6" fill="#f0883e">⇡</tspan>
    </text>
    <rect class="caret" x="196" y="-11" width="8" height="15" fill="#7dd3fc"/>
  </g>

  <!-- corner badge -->
  <g transform="translate(806,26)">
    <rect x="0" y="0" width="70" height="24" rx="6" fill="#0d1117" stroke="#30363d"/>
    <circle cx="14" cy="12" r="4" fill="#3fb950">
      <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="16" class="mono" font-size="10.5" fill="#8b949e">online</text>
  </g>
</svg>
