<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%"
     height="560" role="img" aria-label="Animated comparison of an index seek reading 3 pages against a table scan reading 144">
  <defs>
    <linearGradient id="ixBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#04121a"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="seekG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/><stop offset="100%" stop-color="#2a0a0a"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family:'Cascadia Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; }
    .head { fill:#e2e8f0; font-size:17px; font-weight:700; }
    .sub  { fill:#7c8595; font-size:11px; }
    .lbl  { fill:#cbd5e1; font-size:12px; font-weight:600; }
    .txt  { fill:#94a3b8; font-size:10.5px; }
    .cnt  { fill:#34d399; font-size:15px; font-weight:800; }
    .cntR { fill:#f87171; font-size:15px; font-weight:800; }

    /* the row the seek finds blazes once, then the loop resets */
    .hitLeaf { fill:#0c2e26; stroke:#065f46; }
    
      36%     { fill:#34d399; stroke:#a7f3d0; }
      50%     { fill:#0c2e26; stroke:#065f46; }
    }
    .seekPath { stroke-dasharray:0; fill:none; stroke-width:2.5; stroke-linecap:round; opacity:1; }
    

        
      20%     { opacity:.9; }
      88%     { transform:translateY(96px); opacity:.9; }
      94%,100%{ transform:translateY(96px); opacity:0; }
    }

    .pop { fill:#052e16; stroke:#34d399; }
    

    @media (prefers-reduced-motion: reduce) {
          }
  </style>

  <rect width="960" height="560" fill="url(#ixBg)"/>

  <text x="26" y="36"  class="mono head">SEEK vs SCAN</text>
  <text x="26" y="57"  class="mono sub">Same query, same rows. The only difference is how many pages get touched.</text>

  <!-- ================= SIGNAL BAR: page counts ================= -->
  <g transform="translate(26,78)">
    <rect x="0" y="0" width="428" height="36" rx="7" fill="#071c17" stroke="#065f46"/>
    <text x="16" y="23" class="mono lbl">INDEX SEEK</text>
    <text x="130" y="23" class="mono txt">pages read</text>
    <text x="260" y="24" class="mono cnt">3</text>

    <rect x="464" y="0" width="470" height="36" rx="7" fill="#1a0a0a" stroke="#7f1d1d"/>
    <text x="480" y="23" class="mono lbl" fill="#fca5a5">TABLE SCAN</text>
    <text x="608" y="23" class="mono txt">pages read</text>
    <text x="738" y="24" class="mono cntR">144</text>
  </g>

  <!-- ================= LEFT: SEEK ================= -->
  <g transform="translate(26,146)">
    <rect x="0" y="0" width="428" height="238" rx="9" fill="#071c17" stroke="#065f46"/>
    <text x="18" y="28" class="mono lbl" fill="#6ee7b7">WHERE CountryID = 1</text>

    <!-- B+ tree -->
    <path class="seekPath" d="M76 50 C 76 78, 164 78, 164 96" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <path class="seekPath" d="M164 126 C 164 150, 254 150, 254 172" fill="none" stroke="#34d399" stroke-width="2.5"/>

    <rect x="0" y="36" width="428" height="28" rx="5" fill="url(#seekG)" stroke="#10b981"/>
    <text x="214" y="54" class="mono" font-size="11px" fill="#a7f3d0" text-anchor="middle">
      root        1  …  25000  …  50000
    </text>

    <rect x="0" y="82" width="428" height="28" rx="5" fill="url(#seekG)" stroke="#10b981"/>
    <text x="214" y="100" class="mono" font-size="11px" fill="#a7f3d0" text-anchor="middle">
      branch      CountryID ≤ 500
    </text>

    <g transform="translate(0,150)">
      <rect x="0"   y="0" width="120" height="30" rx="5" fill="#0c2e26" stroke="#065f46"/>
      <text x="60"  y="19" class="mono" font-size="10px" fill="#4b7" text-anchor="middle">leaf</text>
      <rect class="hitLeaf" x="124" y="0" width="116" height="30" rx="5"/>
      <text x="182" y="19" class="mono" font-size="10px" fill="#052e16" font-weight="700" text-anchor="middle">hit</text>
      <rect x="244" y="0" width="120" height="30" rx="5" fill="#0c2e26" stroke="#065f46"/>
      <text x="304" y="19" class="mono" font-size="10px" fill="#4b7" text-anchor="middle">leaf</text>
    </g>

    <text x="18" y="226" class="mono txt">root → branch → leaf ≈ log₂N</text>
  </g>

  <!-- ================= RIGHT: SCAN ================= -->
  <g transform="translate(494,146)">
    <rect x="0" y="0" width="440" height="238" rx="9" fill="#1a0a0a" stroke="#7f1d1d"/>
    <text x="18" y="28" class="mono lbl" fill="#fca5a5">No index → every page</text>

    <!-- flat grid of pages -->
    <g transform="translate(20,42)">
      <g opacity="1">
        <rect x="0"   y="0"   width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="128" y="0"   width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="256" y="0"   width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="0"   y="28"  width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="128" y="28"  width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="256" y="28"  width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="0"   y="56"  width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="128" y="56"  width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="256" y="56"  width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="0"   y="84"  width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="128" y="84"  width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
        <rect x="256" y="84"  width="118" height="24" rx="4" fill="#241a1d" stroke="#3f2e32"/>
      </g>
      <!-- the answer, glowing in the middle of the pile -->
      <rect class="pop" x="128" y="56" width="118" height="24" rx="4"
            fill="#052e16" stroke="#34d399"/>
      <text x="187" y="72" class="mono" font-size="10px" fill="#a7f3d0" text-anchor="middle">here</text>
    </g>

    <text x="18" y="226" class="mono txt">144 pages must be read</text>
  </g>

  <!-- ================= THE TRADE ================= -->
  <g transform="translate(26,404)">
    <rect x="0" y="0" width="440" height="118" rx="8" fill="#1a1408" stroke="#78350f"/>
    <text x="16" y="24" class="mono lbl" fill="#fcd34d">BUT EVERY INDEX HAS A PRICE</text>
    <text x="16" y="48" class="mono" font-size="11px" fill="#fbbf24">updated on every INSERT,</text>
    <text x="16" y="66" class="mono" font-size="11px" fill="#fbbf24">UPDATE and DELETE.</text>
    <text x="16" y="90" class="mono" font-size="11px" fill="#fde68a">Reads faster. Writes slower.</text>

    <rect x="464" y="0" width="470" height="118" rx="8" fill="#0d1420" stroke="#1e3a5f"/>
    <text x="480" y="24" class="mono lbl" fill="#7dd3fc">IS IT EVEN USED?</text>
    <text x="480" y="46" class="mono" font-size="10.5px" fill="#38bdf8">SELECT  s.name, us.user_seeks, us.user_scans,</text>
    <text x="480" y="63" class="mono" font-size="10.5px" fill="#38bdf8">           us.last_user_seek</text>
    <text x="480" y="80" class="mono" font-size="10.5px" fill="#38bdf8">FROM   sys.indexes s</text>
    <text x="480" y="97" class="mono" font-size="10.5px" fill="#38bdf8">LEFT JOIN sys.dm_db_index_usage_stats us ON …;</text>
  </g>
</svg>
