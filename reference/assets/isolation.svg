<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%"
     height="640" role="img"
     aria-label="Animated isolation level matrix: which anomalies each of the five isolation levels prevents">

  <defs>
    <linearGradient id="ilBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#060d14"/>
      <stop offset="100%" stop-color="#0b0f18"/>
    </linearGradient>
    <linearGradient id="winBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family:'Cascadia Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; }
    .head { fill:#e2e8f0; font-size:17px; font-weight:700; }
    .sub  { fill:#7c8595; font-size:11.5px; }
    .rowL { fill:#e2e8f0; font-size:12.5px; font-weight:700; }
    .rowD { fill:#7c8595; font-size:9.5px; }
    .colH { fill:#94a3b8; font-size:8px; font-weight:700; letter-spacing:0; }

    /* one row lights at a time, in order, then the loop resets */
    .activeLevel { opacity:1; }
    
      2%  { opacity:1; }
      17% { opacity:1; }
      20% { opacity:.24; }
      100%{ opacity:.24; }
    }

    .cellWarn { fill:#78350f; }
    .cellBad  { fill:#7f1d1d; }
    .cellGood { fill:#14532d; }
    .cellHalf { fill:#3f1d0a; }

    .cursor { opacity:1; }
    

    @media (prefers-reduced-motion: reduce) {
      .activeLevel,.cursor { opacity:1 }
    }
  </style>

  <rect width="960" height="640" fill="url(#ilBg)"/>

  <!-- ============ header ============ -->
  <text x="26" y="36" class="mono head">ISOLATION LEVELS — what each one lets through</text>
  <text x="26" y="56" class="mono sub">
    Session A reads a row while Session B is halfway through writing it. Each level answers differently.
  </text>

  <!-- ============ contested row ============ -->
  <g transform="translate(26,74)">
    <rect x="0" y="0" width="908" height="58" rx="8" fill="#0b1a2a" stroke="#1e3a5f"/>
    <rect x="0" y="0" width="908" height="22" rx="8" fill="url(#winBar)"/>
    <rect x="0" y="10" width="908" height="12" fill="#111827"/>
    <text x="14" y="15" class="mono" font-size="10" fill="#64748b">
      Session A  ·  Session B
    </text>

    <text x="14" y="42" class="mono" font-size="11px" fill="#38bdf8">
      A  reads row 5  →  'Kenya'
    </text>
    <text x="330" y="42" class="mono" font-size="11px" fill="#f472b6">
      B  updates row 5  →  'KENYA'
    </text>
  </g>

  <!-- ============ level matrix ============ -->
  <g transform="translate(26,154)">
    <!-- column headers -->
    <g class="mono" text-anchor="middle">
      <text x="172" y="0"   class="colH">READ COMMITTED</text>
      <text x="292" y="0"   class="colH">READ UNCOMMITTED</text>
      <text x="412" y="0"   class="colH">REPEATABLE READ</text>
      <text x="532" y="0"   class="colH">SERIALIZABLE</text>
      <text x="652" y="0"   class="colH">SNAPSHOT</text>
    </g>

    <!-- row 1: dirty read -->
    <g class="activeLevel lv1">
      <rect x="0" y="22" width="690" height="38" rx="6" fill="#2a0a0a" opacity=".55"/>
      <text x="8" y="36" class="mono rowL">DIRTY READ</text>
      <text x="8" y="52" class="mono rowD">uncommitted data</text>
      <rect x="152" y="29" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="181" y="45" class="mono" font-size="11px" fill="#fca5a5" text-anchor="middle">✕</text>
      <rect x="272" y="29" width="58" height="24" rx="4" class="cellWarn"/>
      <text x="301" y="45" class="mono" font-size="11px" fill="#fde68a" text-anchor="middle">⚠</text>
      <rect x="392" y="29" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="421" y="45" class="mono" font-size="11px" fill="#fca5a5" text-anchor="middle">✕</text>
      <rect x="512" y="29" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="541" y="45" class="mono" font-size="11px" fill="#fca5a5" text-anchor="middle">✕</text>
      <rect x="632" y="29" width="58" height="24" rx="4" class="cellGood" stroke="#166534"/>
      <text x="661" y="45" class="mono" font-size="11px" fill="#86efac" text-anchor="middle">✓</text>
    </g>

    <!-- row 2: non-repeatable read -->
    <g class="activeLevel lv2">
      <rect x="0" y="68" width="690" height="38" rx="6" fill="#2a1a0a" opacity=".55"/>
      <text x="8" y="82" class="mono rowL">NON-REPEATABLE</text>
      <text x="8" y="98" class="mono rowD">two values</text>
      <rect x="152" y="75" width="58" height="24" rx="4" class="cellWarn"/>
      <text x="181" y="91" class="mono" font-size="11px" fill="#fde68a" text-anchor="middle">⚠</text>
      <rect x="272" y="75" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="301" y="91" class="mono" font-size="11px" fill="#fca5a5" text-anchor="middle">✕</text>
      <rect x="392" y="75" width="58" height="24" rx="4" class="cellGood" stroke="#166534"/>
      <text x="421" y="91" class="mono" font-size="11px" fill="#86efac" text-anchor="middle">✓</text>
      <rect x="512" y="75" width="58" height="24" rx="4" class="cellGood" stroke="#166534"/>
      <text x="541" y="91" class="mono" font-size="11px" fill="#86efac" text-anchor="middle">✓</text>
      <rect x="632" y="75" width="58" height="24" rx="4" class="cellGood" stroke="#166534"/>
      <text x="661" y="91" class="mono" font-size="11px" fill="#86efac" text-anchor="middle">✓</text>
    </g>

    <!-- row 3: phantom -->
    <g class="activeLevel lv3">
      <rect x="0" y="114" width="690" height="38" rx="6" fill="#1a1030" opacity=".55"/>
      <text x="8" y="128" class="mono rowL">PHANTOM</text>
      <text x="8" y="144" class="mono rowD">appears mid-txn</text>
      <rect x="152" y="121" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="181" y="137" class="mono" font-size="11px" fill="#fca5a5" text-anchor="middle">✕</text>
      <rect x="272" y="121" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="301" y="137" class="mono" font-size="11px" fill="#fca5a5" text-anchor="middle">✕</text>
      <rect x="392" y="121" width="58" height="24" rx="4" class="cellHalf" stroke="#78350f"/>
      <text x="421" y="137" class="mono" font-size="11px" fill="#fdba74" text-anchor="middle">~</text>
      <rect x="512" y="121" width="58" height="24" rx="4" class="cellGood" stroke="#166534"/>
      <text x="541" y="137" class="mono" font-size="11px" fill="#86efac" text-anchor="middle">✓</text>
      <rect x="632" y="121" width="58" height="24" rx="4" class="cellGood" stroke="#166534"/>
      <text x="661" y="137" class="mono" font-size="11px" fill="#86efac" text-anchor="middle">✓</text>
    </g>

    <!-- row 4: lost update -->
    <g class="activeLevel lv4">
      <rect x="0" y="160" width="690" height="38" rx="6" fill="#2a0a14" opacity=".55"/>
      <text x="8" y="174" class="mono rowL">LOST UPDATE</text>
      <text x="8" y="190" class="mono rowD">one write vanishes</text>
      <rect x="152" y="167" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="181" y="183" class="mono" font-size="11px" fill="#fca5a5" text-anchor="middle">✕</text>
      <rect x="272" y="167" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="301" y="183" class="mono" font-size="11px" fill="#fca5a5" text-anchor="middle">✕</text>
      <rect x="392" y="167" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="421" y="183" class="mono" font-size="11px" fill="#fca5a5" text-anchor="middle">✕</text>
      <rect x="512" y="167" width="58" height="24" rx="4" class="cellHalf" stroke="#78350f"/>
      <text x="541" y="183" class="mono" font-size="11px" fill="#fdba74" text-anchor="middle">~</text>
      <rect x="632" y="167" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="661" y="183" class="mono" font-size="11px" fill="#fca5a5" text-anchor="middle">✕</text>
    </g>

    <!-- row 5: blocking -->
    <g class="activeLevel lv5">
      <rect x="0" y="206" width="690" height="38" rx="6" fill="#0f1a2a" opacity=".55"/>
      <text x="8" y="220" class="mono rowL">BLOCKING</text>
      <text x="8" y="236" class="mono rowD">waits on writer</text>
      <rect x="152" y="213" width="58" height="24" rx="4" class="cellGood" stroke="#166534"/>
      <text x="181" y="229" class="mono" font-size="10px" fill="#86efac" text-anchor="middle">none</text>
      <rect x="272" y="213" width="58" height="24" rx="4" class="cellWarn"/>
      <text x="301" y="229" class="mono" font-size="10px" fill="#fde68a" text-anchor="middle">brief</text>
      <rect x="392" y="213" width="58" height="24" rx="4" class="cellBad" stroke="#7f1d1d"/>
      <text x="421" y="229" class="mono" font-size="10px" fill="#fecaca" text-anchor="middle">HIGH</text>
      <rect x="512" y="213" width="58" height="24" rx="4" class="cellBad" stroke="#991b1b"/>
      <text x="541" y="229" class="mono" font-size="10px" fill="#fecaca" text-anchor="middle">MAX</text>
      <rect x="632" y="213" width="58" height="24" rx="4" class="cellGood" stroke="#166534"/>
      <text x="661" y="229" class="mono" font-size="10px" fill="#86efac" text-anchor="middle">none</text>
    </g>
  </g>

  <!-- ============ legend ============ -->
  <g transform="translate(744,156)" class="mono">
    <rect x="0" y="0" width="192" height="248" rx="8" fill="#0d1420" stroke="#1e3a5f"/>
    <text x="12" y="22" class="mono" font-size="10.5px" font-weight="700" fill="#7dd3fc">HOW TO READ IT</text>

    <rect x="12" y="36" width="12" height="12" class="cellWarn"/>
    <text x="34" y="46" class="mono" font-size="10px" fill="#e2e8f0">partial result</text>

    <rect x="12" y="62" width="12" height="12" class="cellBad"/>
    <text x="34" y="72" class="mono" font-size="10px" fill="#e2e8f0">blocked / error</text>

    <rect x="12" y="88" width="12" height="12" class="cellGood"/>
    <text x="34" y="98" class="mono" font-size="10px" fill="#e2e8f0">clean, safe</text>

    <rect x="12" y="114" width="12" height="12" class="cellHalf"/>
    <text x="34" y="124" class="mono" font-size="10px" fill="#e2e8f0">unpredictable</text>

    <text x="12" y="156" class="mono" font-size="10.5px" font-weight="700" fill="#94a3b8">THE DEFAULT</text>
    <text x="12" y="174" class="mono" font-size="10px" fill="#e2e8f0">READ COMMITTED</text>

    <text x="12" y="204" class="mono" font-size="10.5px" font-weight="700" fill="#94a3b8">STRONGEST</text>
    <text x="12" y="222" class="mono" font-size="10px" fill="#e2e8f0">SERIALIZABLE</text>
  </g>

  <!-- ============ takeaway ============ -->
  <g transform="translate(26,432)">
    <rect x="0" y="0" width="908" height="54" rx="9" fill="#0d1a26" stroke="#1e3a5f"/>
    <text x="16" y="22" class="mono" font-size="12px" font-weight="700" fill="#7dd3fc">
      The rule of thumb
    </text>
    <text x="16" y="40" class="mono" font-size="11.5px" fill="#e2e8f0">
      Isolation level = how strict your session is about other people's half-finished work.
    </text>
  </g>

  <!-- ============ lock timing strip ============ -->
  <g transform="translate(26,516)">
    <text x="0" y="0" class="mono" font-size="10px" fill="#64748b">LOCKS HELD UNTIL</text>
    <g transform="translate(140,-9)">
      <rect x="0"   y="0" width="132" height="14" rx="3" fill="#1e40af"/>
      <text x="66"  y="10" class="mono" font-size="9px" fill="#c7d2fe" text-anchor="middle">statement ends</text>
      <rect x="132" y="0" width="132" height="14" fill="#3730a3"/>
      <text x="198" y="10" class="mono" font-size="9px" fill="#c7d2fe" text-anchor="middle">transaction ends</text>
      <rect x="264" y="0" width="132" height="14" fill="#581c87"/>
      <text x="330" y="10" class="mono" font-size="9px" fill="#e9d5ff" text-anchor="middle">end + range lock</text>
      <rect x="396" y="0" width="132" height="14" fill="#6d28d9"/>
      <text x="462" y="10" class="mono" font-size="9px" fill="#ddd6fe" text-anchor="middle">never</text>
    </g>
  </g>

  <rect x="26" y="590" width="9" height="15" class="cursor" fill="#38bdf8"/>
  <text x="44" y="602" class="mono" font-size="11px" fill="#475569">
    Default is READ COMMITTED. Stronger levels trade concurrency for safety.
  </text>
</svg>
