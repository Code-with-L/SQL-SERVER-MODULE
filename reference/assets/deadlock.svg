<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="100%"
     height="720" role="img"
     aria-label="Animated deadlock: two transactions each holding a lock the other needs, then SQL Server chooses a victim">

  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0713"/>
      <stop offset="100%" stop-color="#0d0a16"/>
    </linearGradient>
    <linearGradient id="txA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="txB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <marker id="gArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22c55e"/>
    </marker>
    <marker id="rArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <style>
    .mono { font-family:'Cascadia Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; }
    .head { fill:#e2e8f0; font-size:17px; font-weight:700; }
    .sub  { fill:#7c8595; font-size:11.5px; }
    .tbl  { fill:#e6edf3; font-size:12.5px; font-weight:700; }
    .col  { fill:#94a3b8; font-size:11px; }
    .pk   { fill:#fbbf24; font-size:11.5px; font-weight:700; }
    .lblA { fill:#7dd3fc; font-size:11.5px; font-weight:600; }
    .lblB { fill:#f9a8d4; font-size:11.5px; font-weight:600; }
    .tag  { font-size:9.5px; letter-spacing:.6px; font-weight:700; }

    /* hold / wait badges fade in on the same tempo */
    .holdA { animation: holdPulse 8s ease-in-out infinite; }
    .holdB { animation: holdPulse 8s ease-in-out infinite; animation-delay:.7s; }
    .waitA { animation: waitPulse 8s ease-in-out infinite; }
    .waitB { animation: waitPulse 8s ease-in-out infinite; animation-delay:.7s; }
    @keyframes holdPulse { 0%,2%{opacity:0; transform:scale(.9)} 6%,88%{opacity:1; transform:scale(1)} 93%,100%{opacity:0; transform:scale(.9)} }
    @keyframes waitPulse { 0%,12%{opacity:.15} 16%,85%{opacity:1} 90%,100%{opacity:.15} }

    /* the red dependency arrows draw themselves in, then stay */
    .cycle {
      stroke-dasharray: 460; stroke-dashoffset: 460;
      animation: drawCycle 8s ease-out infinite;
    }
    @keyframes drawCycle {
      0%,8%  { stroke-dashoffset:460; opacity:0; }
      12%    { opacity:1; }
      26%    { stroke-dashoffset:0; }
      88%    { stroke-dashoffset:0; opacity:1; }
      94%,100%{ stroke-dashoffset:460; opacity:0; }
    }

    /* victim label appears, then gets replaced by the outcome */
    .victim { animation: victimIn 8s ease-in-out infinite; }
    @keyframes victimIn {
      0%,26%  { opacity:0; transform:scale(.85); }
      32%     { opacity:1; transform:scale(1); }
      88%     { opacity:1; }
      94%,100%{ opacity:0; transform:scale(.85); }
    }

    /* message 1205 sweeps across the bottom */
    .msg { animation: msgIn 8s ease-in-out infinite; }
    @keyframes msgIn {
      0%,28%  { opacity:0; transform:translateY(12px); }
      34%     { opacity:1; transform:none; }
      88%     { opacity:1; }
      94%,100%{ opacity:0; transform:translateY(12px); }
    }

    /* prefers reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .holdA,.holdB,.waitA,.waitB,.cycle,.victim,.msg { animation:none; opacity:1 }
    }
  </style>

  <rect width="980" height="720" fill="url(#dBg)"/>

  <!-- ============ header ============ -->
  <text x="26" y="36" class="mono head">DEADLOCK — who SQL Server sacrifices and why</text>
  <text x="26" y="57" class="mono sub">
    Two transactions, two locks, one cycle. Neither will ever yield.
  </text>

  <!-- ============ SESSION A (left) ============ -->
  <g>
    <rect x="26" y="84" width="244" height="190" rx="10" fill="#0c1a26" stroke="#155e75"/>
    <rect x="26" y="84" width="244" height="30" rx="10" fill="url(#txA)"/>
    <rect x="26" y="103" width="244" height="11" fill="url(#txA)"/>
    <text x="42" y="104" class="mono tag" fill="#04212e">SESSION 51 · TRANSACTION A</text>

    <text x="42" y="138" class="mono" font-size="12px" font-weight="600" fill="#7dd3fc">1. UPDATE Country</text>
    <text x="58" y="159" class="mono" font-size="11px" fill="#94a3b8">SET Country='KENYA'</text>
    <text x="58" y="174" class="mono" font-size="11px" fill="#64748b">WHERE CountryID = 1</text>

    <text x="42" y="202" class="mono" font-size="12px" font-weight="600" fill="#7dd3fc">2. UPDATE StateProvince</text>
    <text x="58" y="221" class="mono" font-size="11px" fill="#94a3b8">SET StateProvince='NRB'</text>

    <g class="holdA">
      <rect x="42" y="222" width="164" height="22" rx="4" fill="#052e1a" stroke="#22c55e"/>
      <text x="52" y="236" class="mono" font-size="10.5px" fill="#86efac">✓ holds Country lock</text>
    </g>
    <g class="waitA">
      <rect x="42" y="248" width="190" height="20" rx="4" fill="#2a0d0d" stroke="#ef4444"/>
      <text x="52" y="262" class="mono" font-size="10.5px" fill="#fca5a5">⏳ WAITING on StateProvince</text>
    </g>
  </g>

  <!-- ============ SESSION B (right) ============ -->
  <g>
    <rect x="710" y="84" width="244" height="190" rx="10" fill="#1a0c17" stroke="#9d174d"/>
    <rect x="710" y="84" width="244" height="30" rx="10" fill="url(#txB)"/>
    <rect x="710" y="103" width="244" height="11" fill="url(#txB)"/>
    <text x="726" y="104" class="mono tag" fill="#2b0512">SESSION 62 · TRANSACTION B</text>

    <text x="726" y="138" class="mono" font-size="12px" font-weight="600" fill="#f9a8d4">1. UPDATE StateProvince</text>
    <text x="742" y="159" class="mono" font-size="11px" fill="#94a3b8">SET StateProvince='NRB'</text>
    <text x="742" y="174" class="mono" font-size="11px" fill="#64748b">WHERE StateProvinceID = 1</text>

    <text x="726" y="202" class="mono" font-size="12px" font-weight="600" fill="#f9a8d4">2. UPDATE Country</text>
    <text x="742" y="221" class="mono" font-size="11px" fill="#94a3b8">SET Country='KENY'</text>

    <g class="holdB">
      <rect x="726" y="222" width="182" height="22" rx="4" fill="#052e1a" stroke="#22c55e"/>
      <text x="736" y="236" class="mono" font-size="10.5px" fill="#86efac">✓ holds StateProvince lock</text>
    </g>
    <g class="waitB">
      <rect x="726" y="248" width="156" height="20" rx="4" fill="#2a0d0d" stroke="#ef4444"/>
      <text x="736" y="262" class="mono" font-size="10.5px" fill="#fca5a5">⏳ WAITING on Country</text>
    </g>
  </g>

  <!-- ============ the two contested tables (middle column) ============ -->
  <!-- Country table -->
  <g>
    <rect x="360" y="84" width="260" height="96" rx="8" fill="#111827" stroke="#334155"/>
    <rect x="360" y="84" width="260" height="24" rx="8" fill="#1e293b"/>
    <rect x="360" y="98" width="260" height="10" fill="#1e293b"/>
    <text x="376" y="100" class="mono tbl">dbo.Country</text>
    <text x="376" y="126" class="mono pk">PK  CountryID = 1</text>
    <text x="376" y="146" class="mono col">    Country   'Kenya'</text>
    <text x="376" y="166" class="mono" font-size="10.5px" fill="#64748b">the contested row</text>
  </g>

  <!-- StateProvince table -->
  <g>
    <rect x="360" y="356" width="260" height="96" rx="8" fill="#111827" stroke="#334155"/>
    <rect x="360" y="356" width="260" height="24" rx="8" fill="#1e293b"/>
    <rect x="360" y="370" width="260" height="10" fill="#1e293b"/>
    <text x="376" y="372" class="mono tbl">dbo.StateProvince</text>
    <text x="376" y="398" class="mono pk">PK  StateProvinceID = 1</text>
    <text x="376" y="418" class="mono col">    StateProvince  'Nairobi'</text>
    <text x="376" y="438" class="mono" font-size="10.5px" fill="#64748b">the contested row</text>
  </g>

  <!-- ============ dependency arrows ============ -->
  <!-- green: holds (begin at the holding transaction, end at the locked table) -->
  <path d="M270 150 H 360" stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#gArrow)"/>
  <line x1="710" y1="150" x2="620" y2="150" stroke="#22c55e" stroke-width="2.5" marker-end="url(#gArrow)" opacity=".85"/>

  <path d="M710 230 C 660 300, 560 330, 480 356"
        stroke="#22c55e" stroke-width="2.5" fill="none" marker-end="url(#gArrow)" opacity=".85"/>

  <!-- red: needs (dashed, draw themselves) -->
  <path class="cycle"
        d="M150 274 C 150 330, 260 356, 380 356"
        stroke="#ef4444" stroke-width="3" fill="none"
        stroke-dasharray="7 7" marker-end="url(#rArrow)"/>

  <path class="cycle"
        d="M850 274 C 850 330, 720 356, 600 356"
        stroke="#ef4444" stroke-width="3" fill="none"
        stroke-dasharray="7 7" marker-end="url(#rArrow)"/>

  <!-- cycle label -->
  <g class="victim" transform="translate(420,258)">
    <rect x="0" y="0" width="140" height="34" rx="7" fill="#2a0d0d" stroke="#ef4444" stroke-width="1.5"/>
    <text x="70" y="22" class="mono" font-size="12px" font-weight="800" fill="#fca5a5"
          text-anchor="middle">CYCLE</text>
  </g>

  <!-- ============ Msg 1205 ============ -->
  <g class="msg" transform="translate(490,538)">
    <rect x="-470" y="-32" width="940" height="64" rx="9" fill="#2a0a0e" stroke="#ef4444" stroke-width="1.6"/>
    <circle cx="-446" cy="0" r="13" fill="#ef4444"/>
    <text x="-446" y="5" class="mono" font-size="15px" font-weight="800" fill="#fff"
          text-anchor="middle">!</text>
    <text x="-422" y="-6" class="mono" font-size="12px" font-weight="700" fill="#fecaca">
      Msg 1205 — Deadlock detected. Transaction chosen as victim.
    </text>
    <text x="-422" y="14" class="mono" font-size="11px" fill="#fca5a5">
      "Execute the transaction again." — your app MUST retry
    </text>
  </g>

  <!-- ============ prevention ============ -->
  <g transform="translate(26,650)">
    <rect x="0" y="0" width="928" height="48" rx="8" fill="#0d1420" stroke="#1e3a5f"/>
    <text x="16" y="21" class="mono" font-size="11px" font-weight="700" fill="#7dd3fc">
      THE REAL FIX — not retries
    </text>
    <text x="16" y="38" class="mono" font-size="11px" fill="#94a3b8">
      Always touch tables in the same order: Country first, StateProvince second — everywhere.
    </text>
  </g>
</svg>
