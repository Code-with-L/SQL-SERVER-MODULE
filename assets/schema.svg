<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="100%"
     height="570" role="img" aria-label="Animated entity relationship diagram of the six course tables">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="junctionGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="headG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f472b6"/>
    </marker>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family:'Cascadia Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; }
    .tname { fill:#e2e8f0; font-size:14px; font-weight:700; letter-spacing:.3px; }
    .col   { fill:#94a3b8; font-size:12px; }
    .pk    { fill:#fbbf24; font-size:12px; font-weight:700; }
    .fk    { fill:#f472b6; font-size:12px; }
    .note  { fill:#64748b; font-size:11px; }
    .edge  { fill:none; stroke:#f472b6; stroke-width:1.6; stroke-dasharray:7 6; opacity:.85; }
    .lbl   { fill:#f9a8d4; font-size:11px; }

    /* draw-in */
    .edgeDraw {
      stroke-dasharray: 420; stroke-dashoffset: 420;
      animation: draw 2.4s ease-out forwards, glow 3s ease-in-out 2.6s infinite;
    }
    @keyframes draw  { to { stroke-dashoffset: 0 } }
    @keyframes glow  { 0%,100%{opacity:.5} 50%{opacity:1} }

    /* packets travelling the edges */
    .pkt { animation: pkt 2.9s linear infinite; }
    @keyframes pkt { 0%{opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{opacity:0} }

    /* boxes pop in */
    .box { animation: pop .55s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes pop { from { opacity:0; transform:scale(.86) } to { opacity:1; transform:scale(1) } }

    /* junction breathes */
    .junctionBox { animation: pop .55s cubic-bezier(.34,1.56,.64,1) 1.5s both,
                              breathe 3.4s ease-in-out 2.3s infinite; }
    @keyframes breathe { 0%,100%{ filter:none } 50%{ filter:drop-shadow(0 0 12px rgba(236,72,153,.75)) } }

    .title { animation: fadeIn .7s ease-out both; }
    .legend { animation: fadeIn .7s ease-out .9s both; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

    .rowCursor { animation: blink 1.1s steps(1,end) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      .edgeDraw,.pkt,.box,.junctionBox,.rowCursor { animation:none; stroke-dashoffset:0; }
    }
  </style>

  <rect width="1000" height="570" fill="url(#page)"/>

  <text x="26" y="34" class="mono title" font-size="17" font-weight="700" fill="#38bdf8">
    dbo.CustomerToCustomerAddress — resolving MANY-TO-MANY
  </text>
  <text x="26" y="52" class="mono title" font-size="11.5" fill="#64748b">
    a customer has many addresses, and one address serves many customers
  </text>

  <!-- ====================== lookup tables (left) ====================== -->
  <g class="box" style="animation-delay:.10s">
    <rect x="40" y="78" width="230" height="96" rx="9" fill="#111827" stroke="#334155"/>
    <rect x="40" y="78" width="230" height="27" rx="9" fill="url(#headG)"/>
    <rect x="40" y="96" width="230" height="9" fill="url(#headG)"/>
    <text x="54" y="97" class="mono tname">dbo.Country</text>
    <text x="54" y="126" class="mono pk">PK  CountryID  int</text>
    <text x="54" y="146" class="mono col">    Country    varchar(50)</text>
    <text x="54" y="164" class="mono note">IDENTITY(1,1)</text>
  </g>

  <g class="box" style="animation-delay:.28s">
    <rect x="40" y="212" width="230" height="96" rx="9" fill="#111827" stroke="#334155"/>
    <rect x="40" y="212" width="230" height="27" rx="9" fill="url(#headG)"/>
    <rect x="40" y="230" width="230" height="9" fill="url(#headG)"/>
    <text x="54" y="231" class="mono tname">dbo.StateProvince</text>
    <text x="54" y="260" class="mono pk">PK  StateProvinceID  int</text>
    <text x="54" y="280" class="mono col">    StateProvince  varchar(50)</text>
  </g>

  <g class="box" style="animation-delay:.46s">
    <rect x="40" y="346" width="230" height="96" rx="9" fill="#111827" stroke="#334155"/>
    <rect x="40" y="346" width="230" height="27" rx="9" fill="url(#headG)"/>
    <rect x="40" y="364" width="230" height="9" fill="url(#headG)"/>
    <text x="54" y="365" class="mono tname">dbo.AddressType</text>
    <text x="54" y="394" class="mono pk">PK  AddressTypeID  tinyint</text>
    <text x="54" y="414" class="mono col">    AddressType  varchar(20)</text>
    <text x="54" y="432" class="mono note">tinyint = 0..255, 1 byte</text>
  </g>

  <!-- ====================== CustomerAddress ====================== -->
  <g class="box" style="animation-delay:.64s">
    <rect x="368" y="78" width="290" height="230" rx="9" fill="#111827" stroke="#334155"/>
    <rect x="368" y="78" width="290" height="27" rx="9" fill="url(#headG)"/>
    <rect x="368" y="96" width="290" height="9" fill="url(#headG)"/>
    <text x="382" y="97" class="mono tname">dbo.CustomerAddress</text>
    <text x="382" y="126" class="mono pk">PK  CustomerAddressID  int</text>
    <text x="382" y="146" class="mono col">    AddressLine1  varchar(30)</text>
    <text x="382" y="164" class="mono col">    AddressLine2  varchar(30)</text>
    <text x="382" y="182" class="mono col">    City          varchar(30)</text>
    <text x="382" y="206" class="mono fk">FK  StateProvinceID →</text>
    <text x="382" y="224" class="mono fk">FK  CountryID       →</text>
    <text x="382" y="242" class="mono fk">FK  AddressTypeID   →</text>
    <text x="382" y="266" class="mono note">referential integrity enforced</text>
    <text x="382" y="284" class="mono note">NOT NULL on every FK</text>
  </g>

  <!-- ====================== Customer ====================== -->
  <g class="box" style="animation-delay:.82s">
    <rect x="700" y="78" width="262" height="230" rx="9" fill="#111827" stroke="#334155"/>
    <rect x="700" y="78" width="262" height="27" rx="9" fill="url(#headG)"/>
    <rect x="700" y="96" width="262" height="9" fill="url(#headG)"/>
    <text x="714" y="97" class="mono tname">dbo.Customer</text>
    <text x="714" y="126" class="mono pk">PK  CustomerID  int</text>
    <text x="714" y="146" class="mono col">    CustomerName  varchar(50)</text>
    <text x="714" y="164" class="mono col">    CreditLine    smallmoney</text>
    <text x="714" y="182" class="mono col">    Outstanding   smallmoney</text>
    <text x="714" y="206" class="mono fk">    AvailableCredit AS (…)</text>
    <text x="714" y="224" class="mono note">computed, never stored</text>
    <text x="714" y="248" class="mono pk">    NOT NULL UNIQUE</text>
    <text x="714" y="266" class="mono note">IDENTITY(1,1)</text>
    <text x="714" y="284" class="mono note">NONCLUSTERED index</text>
  </g>

  <!-- ====================== FK edges from lookups ====================== -->
  <path id="e1" class="edge edgeDraw" style="animation-delay:.5s"
        d="M270 126 C 315 126, 325 140, 368 140"/>
  <path id="e2" class="edge edgeDraw" style="animation-delay:.7s"
        d="M270 260 C 315 260, 325 190, 368 190"/>
  <path id="e3" class="edge edgeDraw" style="animation-delay:.9s"
        d="M270 394 C 315 394, 325 240, 368 240"/>

  <circle class="pkt" r="3.6" fill="#f472b6" filter="url(#soft)">
    <animateMotion dur="3.2s" begin="0s"  repeatCount="indefinite"><mpath href="#e1"/></animateMotion>
  </circle>
  <circle class="pkt" r="3.6" fill="#f472b6" filter="url(#soft)" style="animation-delay:.25s">
    <animateMotion dur="3.2s" begin=".25s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion>
  </circle>
  <circle class="pkt" r="3.6" fill="#f472b6" filter="url(#soft)" style="animation-delay:.5s">
    <animateMotion dur="3.2s" begin=".5s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion>
  </circle>

  <!-- ====================== junction table ====================== -->
  <g class="junctionBox">
    <rect x="420" y="380" width="330" height="130" rx="10" fill="#1a1030"
          stroke="url(#junctionGlow)" stroke-width="2.2"/>
    <rect x="420" y="380" width="330" height="30" rx="10" fill="url(#junctionGlow)"/>
    <rect x="420" y="400" width="330" height="10" fill="url(#junctionGlow)"/>
    <text x="585" y="401" class="mono" font-size="13" font-weight="800"
          fill="#1a1030" text-anchor="middle">dbo.CustomerToCustomerAddress</text>
    <text x="436" y="437" class="mono" font-size="12.5" fill="#e9d5ff">
      <tspan fill="#fcd34d">PK,FK</tspan>  CustomerID        int
    </text>
    <text x="436" y="459" class="mono" font-size="12.5" fill="#e9d5ff">
      <tspan fill="#fcd34d">PK,FK</tspan>  CustomerAddressID int
    </text>
    <text x="436" y="485" class="mono" font-size="11" fill="#a78bfa">
      composite PK — no duplicate links
    </text>
    <text x="436" y="502" class="mono" font-size="11" fill="#a78bfa">
      each row = one customer ↔ one address
    </text>
  </g>

  <!-- edges into the junction -->
  <path id="e4" class="edge edgeDraw" style="animation-delay:1.6s"
        d="M513 308 C 513 340, 520 350, 520 378"/>
  <path id="e5" class="edge edgeDraw" style="animation-delay:1.9s"
        d="M826 308 C 826 350, 700 350, 672 378"/>

  <circle class="pkt" r="3.6" fill="#a855f7" filter="url(#soft)" style="animation-delay:.75s">
    <animateMotion dur="3.2s" begin=".75s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion>
  </circle>
  <circle class="pkt" r="3.6" fill="#a855f7" filter="url(#soft)" style="animation-delay:1s">
    <animateMotion dur="3.2s" begin="1s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion>
  </circle>

  <!-- link labels -->
  <text x="286" y="120" class="mono lbl legend">CountryID</text>
  <text x="286" y="200" class="mono lbl legend">StateProvinceID</text>
  <text x="286" y="300" class="mono lbl legend">AddressTypeID</text>

  <!-- legend -->
  <g class="legend" transform="translate(770,420)">
    <rect x="0" y="0" width="192" height="120" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="14" y="24" class="mono" font-size="11" fill="#94a3b8">LEGEND</text>
    <circle cx="19" cy="44" r="5" fill="#fbbf24"/>
    <text x="32" y="48" class="mono" font-size="11" fill="#cbd5e1">PRIMARY KEY</text>
    <circle cx="19" cy="66" r="5" fill="#f472b6"/>
    <text x="32" y="70" class="mono" font-size="11" fill="#cbd5e1">FOREIGN KEY</text>
    <circle cx="19" cy="88" r="5" fill="#64748b"/>
    <text x="32" y="92" class="mono" font-size="11" fill="#cbd5e1">plain column</text>
    <text x="14" y="112" class="mono" font-size="10" fill="#64748b">live packets →</text>
  </g>

  <!-- animated row counter, like a SELECT COUNT(*) -->
  <g class="title" transform="translate(40,505)">
    <text x="0" y="0" class="mono" font-size="11.5" fill="#475569">
      <tspan fill="#38bdf8">SELECT</tspan> COUNT(*) <tspan fill="#38bdf8">FROM</tspan> dbo.CustomerToCustomerAddress;
    </text>
    <rect x="238" y="-11" width="8" height="13" class="rowCursor"/>
  </g>
</svg>
