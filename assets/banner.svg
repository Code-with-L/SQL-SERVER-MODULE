<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="340"
     role="img" aria-label="SQL Server Module — animated terminal banner">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b1020"/>
      <stop offset="55%"  stop-color="#101728"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8"/>
      <stop offset="50%"  stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="0 0; 1 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="cylGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- typing reveal windows, one per line -->
    <clipPath id="clip1"><rect x="0" y="0" height="1">
      <animate attributeName="width" values="0;250;250;0" keyTimes="0;0.06;0.94;1"
               dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip2"><rect x="0" y="0" height="1">
      <animate attributeName="width" values="0;0;380;380;0" keyTimes="0;0.06;0.13;0.94;1"
               dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip3"><rect x="0" y="0" height="1">
      <animate attributeName="width" values="0;0;310;310;0" keyTimes="0;0.14;0.21;0.94;1"
               dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip4"><rect x="0" y="0" height="1">
      <animate attributeName="width" values="0;0;310;310;0" keyTimes="0;0.22;0.29;0.94;1"
               dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip5"><rect x="0" y="0" height="1">
      <animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.30;0.37;0.94;1"
               dur="14s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="clip6"><rect x="0" y="0" height="1">
      <animate attributeName="width" values="0;0;330;330;0" keyTimes="0;0.38;0.45;0.94;1"
               dur="14s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family: 'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,
            'DejaVu Sans Mono',monospace; }
    .lbl  { fill:#7d8799; font-size:14px; }
    .val  { fill:#e6edf3; font-size:14px; font-weight:600; }
    .prm  { fill:#c792ea; font-size:14px; }
    .path { fill:#4b5563; font-size:14px; }

    .cursor { fill:#38bdf8; animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }

    .bob    { animation: bob 3.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-5px) } }

    .spin   { animation: spin 9s linear infinite; transform-origin:60px 74px; }
    @keyframes spin { to { transform:rotate(360deg) } }

    .sweep  { animation: sweep 5.5s ease-in-out infinite; }
    @keyframes sweep { 0%,100% { opacity:.10 } 50% { opacity:.55 } }

    .dot1 { animation: pulse 2.0s ease-in-out infinite; }
    .dot2 { animation: pulse 2.0s ease-in-out .25s infinite; }
    .dot3 { animation: pulse 2.0s ease-in-out .5s infinite; }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }

    .bar1 { animation: flow 2.4s linear infinite; }
    .bar2 { animation: flow 2.4s linear .8s infinite; }
    .bar3 { animation: flow 2.4s linear 1.6s infinite; }
    @keyframes flow { 0% { opacity:.25 } 50% { opacity:1 } 100% { opacity:.25 } }

    /* fade the whole thing up on load */
    .fade { animation: fadeIn 1.1s ease-out both; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px) }
                        to   { opacity:1; transform:translateY(0) } }

    @media (prefers-reduced-motion: reduce) {
      .cursor,.bob,.spin,.sweep,.dot1,.dot2,.dot3,
      .bar1,.bar2,.bar3 { animation:none; }
    }
  </style>

  <rect width="900" height="340" fill="url(#bgGrad)"/>
  <ellipse cx="450" cy="70" rx="420" ry="120" fill="url(#glow)" class="sweep"/>

  <g class="fade">
    <!-- ===== spinning database cylinder ===== -->
    <g class="bob">
      <ellipse cx="60" cy="58" rx="34" ry="11" fill="url(#cylGrad)"/>
      <path d="M26 58 v30 a34 11 0 0 0 68 0 v-30 z" fill="#0f766e"/>
      <path d="M26 58 v30 a34 11 0 0 0 68 0 v-30" fill="none"
            stroke="#34d399" stroke-width="2"/>
      <ellipse cx="60" cy="58" rx="34" ry="11" fill="none"
               stroke="#6ee7b7" stroke-width="2"/>
      <path d="M26 73 a34 11 0 0 0 68 0" fill="none"
            stroke="#34d399" stroke-width="1.4" opacity=".65"/>
      <path d="M26 88 a34 11 0 0 0 68 0" fill="none"
            stroke="#34d399" stroke-width="1.4" opacity=".4"/>
    </g>
    <g class="spin" opacity=".85">
      <circle cx="60" cy="74" r="46" fill="none" stroke="#38bdf8"
              stroke-width="1" stroke-dasharray="4 10" opacity=".55"/>
    </g>

    <!-- ===== title ===== -->
    <text x="128" y="66" class="mono" font-size="30" font-weight="700"
          letter-spacing="3" fill="url(#titleGrad)">SQL SERVER</text>
    <text x="128" y="98" class="mono" font-size="16" font-weight="500"
          letter-spacing="7" fill="#6b7280">M O D U L E</text>

    <!-- ===== terminal window ===== -->
    <rect x="26" y="126" width="848" height="192" rx="12"
          fill="#0d1117" stroke="#1f2937" stroke-width="1.5"/>
    <rect x="26" y="126" width="848" height="34" rx="12" fill="#161b22"/>
    <rect x="26" y="152" width="848" height="8" fill="#161b22"/>
    <line x1="26" y1="160" x2="874" y2="160" stroke="#1f2937" stroke-width="1"/>

    <circle class="dot1" cx="50" cy="143" r="6" fill="#ff5f57"/>
    <circle class="dot2" cx="70" cy="143" r="6" fill="#febc2e"/>
    <circle class="dot3" cx="90" cy="143" r="6" fill="#28c840"/>
    <text x="450" y="148" class="mono" font-size="12" fill="#6b7280"
          text-anchor="middle">sqlcmd — StudentRecordsDB</text>

    <!-- ===== command line ===== -->
    <text x="52" y="190" class="mono prm" clip-path="url(#clip1)"><tspan>$</tspan> sqlcmd -S localhost -E</text>

    <!-- ===== results ===== -->
    <text x="52" y="216" class="mono path" clip-path="url(#clip2)">─────────────────────────────────────────</text>

    <text x="52" y="242" clip-path="url(#clip3)"><tspan class="lbl">Instance </tspan><tspan class="val">: MSSQLSERVER (default)</tspan></text>
    <text x="52" y="266" clip-path="url(#clip4)"><tspan class="lbl">Engine   </tspan><tspan class="val">: SQL Server 2025 (17.0)</tspan></text>
    <text x="52" y="290" clip-path="url(#clip5)"><tspan class="lbl">Edition  </tspan><tspan class="val">: Enterprise Developer</tspan></text>
    <text x="52" y="314" clip-path="url(#clip6)"><tspan class="lbl">Auth     </tspan><tspan class="val">: Windows Authentication</tspan></text>

    <!-- blinking cursor at end of the last line -->
    <rect class="cursor" x="368" y="302" width="10" height="16"/>

    <!-- ===== activity bars ===== -->
    <g transform="translate(700,232)">
      <rect class="bar1" x="0"  y="0"  width="14" height="14" rx="3" fill="#38bdf8"/>
      <rect class="bar2" x="20" y="0"  width="14" height="14" rx="3" fill="#818cf8"/>
      <rect class="bar3" x="40" y="0"  width="14" height="14" rx="3" fill="#f472b6"/>
      <text x="0" y="46" class="mono" font-size="11" fill="#6b7280">● online</text>
    </g>
  </g>
</svg>
