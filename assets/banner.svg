<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%"
     height="340" role="img"
     aria-label="SQL Server Module: animated terminal banner">

  <defs>
    <!-- ==================== BACKGROUND ==================== -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#070b16"/>
      <stop offset="45%"  stop-color="#0d1428"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.2" cy="0.5" r="0.7">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity=".40"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.82" cy="0.5" r="0.7">
      <stop offset="0%"   stop-color="#c084fc" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="titleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7dd3fc"/>
      <stop offset="38%"  stop-color="#a5b4fc"/>
      <stop offset="72%"  stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#fda4af"/>
      <animateTransform attributeName="gradientTransform" type="translate"
                        values="-0.3 0; 0.3 0; -0.3 0"
                        dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="cylG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5eead4"/>
      <stop offset="50%"  stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="winBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="50%"  stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#38bdf8" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect x="0" y="0" width="900" height="340" rx="14"/></clipPath>

    <!-- ==================== TYPEWRITER CLIPS ==================== -->
    <!-- each line reveals left-to-right, staggered, then the loop resets -->
    <clipPath id="t1"><rect x="0" y="0" height="18">
      <animate attributeName="width" values="0;0;250;250;0"
               keyTimes="0;.04;.10;.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="0" height="18">
      <animate attributeName="width" values="0;0;30;30;0"
               keyTimes="0;.10;.13;.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="0" y="0" height="18">
      <animate attributeName="width" values="0;0;300;300;0"
               keyTimes="0;.13;.19;.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t4"><rect x="0" y="0" height="18">
      <animate attributeName="width" values="0;0;290;290;0"
               keyTimes="0;.19;.25;.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t5"><rect x="0" y="0" height="18">
      <animate attributeName="width" values="0;0;285;285;0"
               keyTimes="0;.25;.31;.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t6"><rect x="0" y="0" height="18">
      <animate attributeName="width" values="0;0;320;320;0"
               keyTimes="0;.31;.38;.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t7"><rect x="0" y="0" height="18">
      <animate attributeName="width" values="0;0;345;345;0"
               keyTimes="0;.38;.45;.92;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <style>
    .mono { font-family:'Cascadia Mono','JetBrains Mono','Fira Code',Consolas,
            'DejaVu Sans Mono',monospace; }

    .lbl  { fill:#7d8da8; font-size:13px; }
    .val  { fill:#e8eefb; font-size:13px; font-weight:600; }
    .prm  { fill:#c4b5fd; font-size:13px; }
    .path { fill:#3f4c66; font-size:13px; }

    /* blinking caret */
    .caret { animation: blink 1.05s steps(1,end) infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    /* slow drifting aurora behind everything */
    .aurA { animation: drift 17s ease-in-out infinite; }
    .aurB { animation: drift 23s ease-in-out infinite; animation-delay:-6s; }
    @keyframes drift {
      0%,100% { transform:translate(0,0) scale(1); }
      33%     { transform:translate(26px,-14px) scale(1.09); }
      66%     { transform:translate(-22px,12px) scale(.94); }
    }

    /* faint horizontal light sweep */
    .sweep { animation: sweepY 9s ease-in-out infinite; }
    @keyframes sweepY {
      0%,100% { transform:translateY(-120px); opacity:0; }
      12%     { opacity:1; }
      88%     { opacity:1; }
      100%    { transform:translateY(360px); opacity:0; }
    }

    /* the database cylinder floats */
    .bob  { animation: bob 4.2s ease-in-out infinite; }
    @keyframes bob {
      0%,100% { transform:translateY(0) }
      50%     { transform:translateY(-6px) }
    }

    /* rings orbiting at different rates and directions */
    .ring1 { animation: spin 16s linear infinite; transform-origin:96px 96px; }
    .ring2 { animation: spin 11s linear infinite reverse; transform-origin:96px 96px; }
    .ring3 { animation: spin 22s linear infinite; transform-origin:96px 96px; }
    @keyframes spin { to { transform:rotate(360deg) } }

    /* data bands breathing inside the cylinder */
    .band { animation: bandB 3.2s ease-in-out infinite; }
    @keyframes bandB { 0%,100%{opacity:.30} 50%{opacity:.95} }

    /* window chrome */
    .dot1 { animation: pulse 2.0s ease-in-out infinite; }
    .dot2 { animation: pulse 2.0s ease-in-out .28s infinite; }
    .dot3 { animation: pulse 2.0s ease-in-out .56s infinite; }
    @keyframes pulse { 0%,100%{opacity:.32} 50%{opacity:1} }

    /* status pips on the right of each row */
    .pip { animation: pipGlow 2.6s ease-in-out infinite; }
    @keyframes pipGlow { 0%,100%{opacity:.25} 50%{opacity:.85} }

    /* one-shot entrance, then it just lives */
    .in { animation: enter .9s cubic-bezier(.22,1,.36,1) both; }
    @keyframes enter {
      from { opacity:0; transform:translateY(12px) }
      to   { opacity:1; transform:none }
    }

    /* underline under the wordmark */
    .rule { animation: ruleGrow 1.6s cubic-bezier(.22,1,.36,1) .3s both; }
    @keyframes ruleGrow { from { opacity:0; transform:scaleX(0) } to { opacity:1; transform:none } }

    @media (prefers-reduced-motion: reduce) {
      .aurA,.aurB,.sweep,.bob,.ring1,.ring2,.ring3,.band,
      .dot1,.dot2,.dot3,.pip,.caret { animation:none; opacity:1 }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="340" fill="url(#bg)"/>

    <!-- ============ ambient light ============ -->
    <ellipse class="aurA" cx="180" cy="200" rx="340" ry="220" fill="url(#glowA)"/>
    <ellipse class="aurB" cx="740" cy="140" rx="330" ry="200" fill="url(#glowB)"/>
    <rect class="sweep" width="900" height="150" fill="url(#scanG)"/>

    <!-- ============ faint grid, for depth ============ -->
    <g opacity=".20" stroke="#1b2537" stroke-width=".5">
      <line x1="0" y1="56"  x2="900" y2="56"/>
      <line x1="0" y1="114" x2="900" y2="114"/>
      <line x1="0" y1="172" x2="900" y2="172"/>
      <line x1="0" y1="230" x2="900" y2="230"/>
      <line x1="0" y1="288" x2="900" y2="288"/>
      <line x1="150" y1="0" x2="150" y2="340"/>
      <line x1="300" y1="0" x2="300" y2="340"/>
      <line x1="450" y1="0" x2="450" y2="340"/>
      <line x1="600" y1="0" x2="600" y2="340"/>
      <line x1="750" y1="0" x2="750" y2="340"/>
    </g>

    <!-- ============ emblem ============ -->
    <g class="in">
      <!-- orbits -->
      <circle class="ring1" cx="96" cy="96" r="74" fill="none"
              stroke="url(#titleG)" stroke-width="1.5"
              stroke-dasharray="52 240" stroke-linecap="round"/>
      <circle class="ring2" cx="96" cy="96" r="62" fill="none"
              stroke="#38bdf8" stroke-width="1"
              stroke-dasharray="6 14" opacity=".45"/>
      <circle class="ring3" cx="96" cy="96" r="86" fill="none"
              stroke="#e879f9" stroke-width="1"
              stroke-dasharray="3 11" opacity=".32"/>

      <!-- cylinder -->
      <g class="bob">
        <ellipse cx="96" cy="74" rx="36" ry="12" fill="url(#cylG)"/>
        <path d="M60 74 v42 a36 12 0 0 0 72 0 v-42 z" fill="#0a1c2e"/>
        <path d="M60 74 v42 a36 12 0 0 0 72 0 v-42" fill="none"
              stroke="#67e8f9" stroke-width="2"/>
        <ellipse cx="96" cy="74" rx="36" ry="12" fill="none"
                 stroke="#a5f3fc" stroke-width="2"/>
        <path d="M60 90 a36 12 0 0 0 72 0" fill="none"
              stroke="#38bdf8" stroke-width="1.3" opacity=".55"/>
        <path d="M60 106 a36 12 0 0 0 72 0" fill="none"
              stroke="#38bdf8" stroke-width="1.3" opacity=".3"/>

        <g class="band">
          <rect x="74" y="82"  width="44" height="3" rx="1.5" fill="#a5f3fc" opacity=".8"/>
          <rect x="79" y="92"  width="34" height="3" rx="1.5" fill="#c4b5fd" opacity=".8"/>
          <rect x="84" y="102" width="24" height="3" rx="1.5" fill="#f0abfc" opacity=".8"/>
        </g>
      </g>

      <circle cx="96" cy="66" r="4" fill="#5eead4" filter="url(#softGlow)">
        <animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".45;1;.45" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ============ wordmark ============ -->
    <g class="in">
      <text x="212" y="90" class="mono" font-size="32" font-weight="800"
            letter-spacing="4" fill="url(#titleG)">SQL SERVER</text>
      <text x="214" y="116" class="mono" font-size="14" font-weight="500"
            letter-spacing="9.5" fill="#5c6b87">M O D U L E</text>
      <rect class="rule" x="214" y="126" width="250" height="1.5"
            fill="url(#hairline)"/>
    </g>

    <!-- ============ terminal ============ -->
    <g class="in" style="animation-delay:.18s">
      <rect x="196" y="148" width="676" height="168" rx="11"
            fill="#050a14" stroke="#1e293b" stroke-width="1.4"/>
      <rect x="196" y="148" width="676" height="32" rx="11" fill="url(#winBar)"/>
      <rect x="196" y="170" width="676" height="10" fill="url(#winBar)"/>
      <line x1="196" y1="180" x2="872" y2="180" stroke="#1e293b" stroke-width="1"/>

      <circle class="dot1" cx="216" cy="164" r="5.5" fill="#ff5f57"/>
      <circle class="dot2" cx="234" cy="164" r="5.5" fill="#febc2e"/>
      <circle class="dot3" cx="252" cy="164" r="5.5" fill="#28c840"/>
      <text x="534" y="168" class="mono" font-size="11.5" fill="#64748b"
            text-anchor="middle">sqlcmd — StudentRecordsDB</text>

      <!-- command -->
      <text x="218" y="208" class="mono prm" clip-path="url(#t1)"><tspan fill="#5eead4">$</tspan> sqlcmd -S localhost -E</text>

      <!-- rule -->
      <text x="218" y="230" class="mono path" clip-path="url(#t2)">────────────────────────</text>

      <!-- rows -->
      <g class="mono" font-size="13">
        <text x="218" y="252" clip-path="url(#t3)"><tspan class="lbl">Instance  </tspan><tspan class="val">MSSQLSERVER (default)</tspan></text>
        <text x="218" y="272" clip-path="url(#t4)"><tspan class="lbl">Engine    </tspan><tspan class="val">SQL Server 2025 (17.0)</tspan></text>
        <text x="218" y="292" clip-path="url(#t5)"><tspan class="lbl">Edition   </tspan><tspan class="val">Enterprise Developer</tspan></text>
        <text x="218" y="312" clip-path="url(#t6)"><tspan class="lbl">Auth      </tspan><tspan class="val">Windows Authentication</tspan></text>
      </g>

      <!-- caret, parked at the end of the last row -->
      <rect class="caret" x="548" y="300" width="9" height="16" fill="#7dd3fc"/>

      <!-- right-hand status pips -->
      <g transform="translate(800,246)">
        <g class="pip" style="animation-delay:0s">
          <rect x="0" y="0" width="44" height="8" rx="4" fill="#38bdf8" opacity=".5"/>
        </g>
        <g class="pip" style="animation-delay:.3s">
          <rect x="0" y="16" width="44" height="8" rx="4" fill="#818cf8" opacity=".5"/>
        </g>
        <g class="pip" style="animation-delay:.6s">
          <rect x="0" y="32" width="44" height="8" rx="4" fill="#e879f9" opacity=".5"/>
        </g>
        <g class="pip" style="animation-delay:.9s">
          <rect x="0" y="48" width="44" height="8" rx="4" fill="#34d399" opacity=".5"/>
        </g>
      </g>
    </g>

    <!-- ============ footer ============ -->
    <g class="in" style="animation-delay:.3s">
      <text x="196" y="330" class="mono" font-size="10.5" fill="#3d4a63">
        editions · instances · data types · tables · temp tables · GRANT ·
        snapshots · replication · locking · deadlocks · isolation levels
      </text>
    </g>
  </g>

  <!-- outer hairline so the card reads as one object -->
  <rect x=".75" y=".75" width="898.5" height="338.5" rx="13.25"
        fill="none" stroke="#1e293b" stroke-width="1.5"/>
</svg>
