<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%"
     height="520" role="img" aria-label="Animated code editor typing CREATE TABLE Students">
  <defs>
    <linearGradient id="edBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="edTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family:'Cascadia Mono','JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace; }
    .ln   { fill:#3f4c5f; font-size:12px; text-anchor:end; }
    .kw   { fill:#ff7b72; font-weight:600; }
    .ty   { fill:#79c0ff; }
    .fn   { fill:#d2a8ff; }
    .id   { fill:#ffa657; }
    .lit  { fill:#a5d6ff; }
    .com  { fill:#6e7681; font-style:italic; }
    .cm   { fill:#8b949e; font-style:italic; }

    /* caret: visible only while its line is being typed (see clip timings) */
    .caretA { animation: blink 1s steps(1,end) infinite, life 20s linear infinite; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes life {
      0%   { animation-timing-function:steps(1,end); opacity:0; }
      4%   { opacity:1; }
      6%   { animation-timing-function:steps(1,end); opacity:1; }
      13%  { opacity:1; }
      15%  { animation-timing-function:steps(1,end); opacity:0; }
      100% { opacity:0; }
    }
    .c-cmd { animation-delay:0s, 0s; }
    .c-l1  { animation-delay:0s, .4s; }
    .c-l2  { animation-delay:0s, 2.4s; }
    .c-l3  { animation-delay:0s, 3.0s; }
    .c-l4  { animation-delay:0s, 4.4s; }

    .slide { animation: slide .7s cubic-bezier(.22,1,.36,1) both; }
    @keyframes slide { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }

    .ok    { animation: okPop .6s cubic-bezier(.34,1.56,.64,1) 11s both, dim 9s 11s infinite; }
    @keyframes okPop { from{opacity:0; transform:scale(.8)} to{opacity:1; transform:scale(1)} }
    @keyframes dim   { 0%,100%{opacity:1} 50%{opacity:.5} }

    .sqlDot { animation: sqlPulse 1.4s ease-in-out infinite; }
    @keyframes sqlPulse { 0%,100%{opacity:.35} 50%{opacity:1} }

    @media (prefers-reduced-motion: reduce) {
      .slide,.ok,.sqlDot { animation:none; }
      .caretA { animation:none; }
    }
  </style>

  <rect width="920" height="520" rx="12" fill="url(#edBg)" stroke="#30363d"/>

  <!-- title bar -->
  <rect width="920" height="38" rx="12" fill="#161b22"/>
  <rect y="26" width="920" height="12" fill="#161b22"/>
  <line x1="0" y1="38" x2="920" y2="38" stroke="#30363d"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text x="460" y="24" class="mono" font-size="12" fill="#8b949e" text-anchor="middle">
    01_create_permanent_tables.sql — StudentRecordsDB
  </text>
  <circle class="sqlDot" cx="876" cy="19" r="5" fill="#3fb950"/>

  <!-- activity bar -->
  <rect x="0" y="38" width="46" height="482" fill="#010409"/>
  <rect x="12" y="58" width="22" height="22" rx="4" fill="#1f6feb" opacity=".25"/>
  <text x="23" y="74" class="mono" font-size="15" fill="#e6edf3" text-anchor="middle">▤</text>
  <text x="23" y="112" class="mono" font-size="15" fill="#484f58" text-anchor="middle">⌕</text>
  <text x="23" y="150" class="mono" font-size="15" fill="#484f58" text-anchor="middle">⑂</text>
  <text x="23" y="188" class="mono" font-size="15" fill="#484f58" text-anchor="middle">▷</text>

  <!-- line numbers -->
  <g class="mono ln">
    <text x="66" y="72">1</text><text x="66" y="96">2</text>
    <text x="66" y="120">3</text><text x="66" y="144">4</text>
    <text x="66" y="168">5</text><text x="66" y="192">6</text>
    <text x="66" y="216">7</text><text x="66" y="240">8</text>
    <text x="66" y="264">9</text><text x="66" y="288">10</text>
    <text x="66" y="312">11</text><text x="66" y="336">12</text>
    <text x="66" y="360">13</text>
  </g>

  <!-- code -->
  <g class="slide">
    <text x="82" y="72" class="mono" font-size="14" clip-path="url(#c1)"><tspan class="com">-- the simplest table in the schema</tspan></text>
    <text x="82" y="96" class="mono" font-size="14"><tspan class="kw">CREATE TABLE</tspan> <tspan class="kw">dbo</tspan>.<tspan class="id">Country</tspan></text>

    <text x="82" y="120" class="mono" font-size="14" clip-path="url(#c2)"><tspan class="id">CountryID</tspan>  <tspan class="ty">int</tspan> <tspan class="fn">IDENTITY</tspan>(1,1) <tspan class="kw">PRIMARY KEY</tspan>,</text>
    <text x="82" y="144" class="mono" font-size="14" clip-path="url(#c3)"><tspan class="id">Country</tspan>    <tspan class="ty">varchar</tspan>(50) <tspan class="kw">NOT NULL</tspan></text>
    <text x="82" y="168" class="mono" font-size="14"><tspan class="lit">,</tspan></text>

    <text x="82" y="192" class="mono" font-size="14" clip-path="url(#c4)"><tspan class="kw">CONSTRAINT</tspan> <tspan class="fn">UQ_Country</tspan> <tspan class="kw">UNIQUE</tspan> (<tspan class="id">Country</tspan>)</text>
    <text x="82" y="216" class="mono" font-size="14"><tspan class="lit">)</tspan><tspan class="lit">;</tspan></text>
  </g>

  <!-- carets: one per line, each only alive while its line is typing -->
  <g fill="#58a6ff">
    <rect class="caretA c-cmd" x="404" y="82"  width="9" height="16"/>
    <rect class="caretA c-l1"  x="588" y="106" width="9" height="16"/>
    <rect class="caretA c-l2"  x="392" y="130" width="9" height="16"/>
    <rect class="caretA c-l3"  x="132" y="178" width="9" height="16"/>
    <rect class="caretA c-l4"  x="132" y="202" width="9" height="16"/>
  </g>

  <!-- minimap -->
  <g opacity=".45">
    <rect x="852" y="52" width="52" height="300" rx="3" fill="#010409"/>
    <g fill="#2d333b">
      <rect x="858" y="60"  width="18" height="3" rx="1.5"/>
      <rect x="858" y="68"  width="30" height="3" rx="1.5"/>
      <rect x="858" y="76"  width="24" height="3" rx="1.5"/>
      <rect x="862" y="84"  width="34" height="3" rx="1.5"/>
      <rect x="862" y="92"  width="22" height="3" rx="1.5"/>
      <rect x="858" y="104" width="8"  height="3" rx="1.5"/>
      <rect x="858" y="116" width="30" height="3" rx="1.5"/>
      <rect x="858" y="128" width="26" height="3" rx="1.5"/>
    </g>
    <rect x="850" y="58" width="56" height="110" rx="3" fill="none"
          stroke="#58a6ff" stroke-width="1" opacity=".5">
      <animate attributeName="opacity" values=".3;.8;.3" dur="2.4s"
               repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- status bar -->
  <rect x="0" y="486" width="920" height="34" fill="url(#edTitle)"/>
  <text x="18" y="507" class="mono" font-size="11.5" fill="#ffffff">main*</text>
  <circle cx="120" cy="503" r="4" fill="#ffffff" opacity=".7"/>
  <text x="140" y="507" class="mono" font-size="11.5" fill="#ffffff">0 errors, 0 warnings</text>
  <text x="880" y="507" class="mono" font-size="11.5" fill="#ffffff" text-anchor="end">
    T-SQL  ·  UTF-8  ·  UTF-16 LE
  </text>

  <!-- SUCCESS toast -->
  <g class="ok" transform="translate(300,404)">
    <rect x="0" y="0" width="330" height="60" rx="9" fill="#0d2818" stroke="#3fb950" stroke-width="1.5"/>
    <circle cx="26" cy="30" r="11" fill="#3fb950"/>
    <path d="M20 30 l5 5 l9 -11" fill="none" stroke="#0d2818"
          stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="26" class="mono" font-size="12.5" fill="#7ee787" font-weight="700">
      Command(s) completed successfully
    </text>
    <text x="48" y="45" class="mono" font-size="11" fill="#56d364">
      CREATE TABLE dbo.Country
    </text>
  </g>

  <defs>
    <clipPath id="c1"><rect x="80" y="58" width="700" height="20">
      <animate attributeName="width" values="0;700;700;0" keyTimes="0;.05;.90;1"
               dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="80" y="106" width="700" height="20">
      <animate attributeName="width" values="0;0;700;700;0" keyTimes="0;.05;.12;.90;1"
               dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="80" y="130" width="700" height="20">
      <animate attributeName="width" values="0;0;700;700;0" keyTimes="0;.12;.18;.90;1"
               dur="20s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c4"><rect x="80" y="178" width="700" height="20">
      <animate attributeName="width" values="0;0;700;700;0" keyTimes="0;.18;.26;.90;1"
               dur="20s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
</svg>
